# Default configuration for HHGoa Voice-Enabled RAG
app:
  name: HHGoa-RAG
  version: 0.1.0
  debug: false

logging:
  level: INFO
  format: json

latency:
  # Three separately instrumented metrics for engineering benchmarks
  metrics:
    rag_latency: "query_processing + embedding + retrieval + reranking + generation + guardrails"
    stt_latency: "isolated speech-to-text processing time"
    e2e_latency: "stt_latency + rag_latency (server receipt of audio to final response)"
  # Benchmark note: microphone/user speech duration and browser audio-capture time are excluded
  rag_components:
    - query_processing
    - embedding
    - retrieval
    - reranking
    - generation
    - guardrails
  stt_components:
    - stt
  e2e_components:
    - stt
    - query_processing
    - embedding
    - retrieval
    - reranking
    - generation
    - guardrails

dataset:
  name: "ai4bharat/MSMARCO-XI"
  hf_url: "https://huggingface.co/datasets/ai4bharat/MSMARCO-XI"
  sample_seed: 42
  languages:
    - code: "hin"
      name: "Hindi"
      train_file: "train/hintrain.parquet"
      val_file: "validation/hinval.parquet"
    - code: "mar"
      name: "Marathi"
      train_file: "train/martrain.parquet"
      val_file: "validation/marval.parquet"
    - code: "ben"
      name: "Bengali"
      train_file: "train/bentrain.parquet"
      val_file: "validation/benval.parquet"
    - code: "tam"
      name: "Tamil"
      train_file: "train/tamtrain.parquet"
      val_file: "validation/tamval.parquet"
    - code: "tel"
      name: "Telugu"
      train_file: null # Telugu train file not published; validation available
      val_file: "validation/telval.parquet"
  dev_samples_per_language: 200
  eval_samples_per_language: 50
  output_dir: "data/processed"

chunking:
  default_strategy: "passage"
  strategies:
    - "passage"
    - "fixed"
    - "overlap"
    - "structure_aware"
  
  # Data-driven parameters based on Phase 1 analysis (mean passage len = 60.1 words, median = 53 words)
  fixed:
    max_words: 80
    overlap_words: 0

  overlap:
    max_words: 80
    overlap_words: 20

  structure_aware:
    max_words: 80

embedding:
  selected_model: "intfloat/multilingual-e5-small"
  fallback_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  dimension: 384
  device: "cpu"
  normalize: true
  batch_size: 64

vector_store:
  type: "faiss"
  metric: "cosine"
  index_dir: "data/indexes/multilingual_e5_small_structure_aware"
  top_k: 10
  fetch_k: 50




